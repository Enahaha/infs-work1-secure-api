name: Work 1 - Tests and Security

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests-and-sast:
    name: Tests and SAST
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run integration tests
        run: mvn -B -ntp test
      - name: Scan application with SpotBugs and FindSecBugs
        run: mvn -B -ntp -Psast -DskipTests compile spotbugs:check
      - name: Render SAST HTML report
        if: always() && hashFiles('target/spotbugsXml.xml') != ''
        run: python3 scripts/sast_report.py
      - name: Save test and SAST reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests-and-sast-reports
          path: |
            target/surefire-reports/
            target/spotbugsXml.xml
            target/spotbugs.xml
            target/site/
            target/reports/
          retention-days: 30

  sca:
    name: Dependency vulnerability scan (SCA)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Restore vulnerability database cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/work1-dependency-check-12.2.2
          key: nvd-v12.2.2-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            nvd-v12.2.2-${{ runner.os }}-
      - name: Check dependencies using NVD vulnerability data
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: bash scripts/run-sca.sh
      - name: Save dependency scan reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sca-reports
          path: |
            target/dependency-check-report.html
            target/dependency-check-report.json
          retention-days: 30
